# Decap CMS — https://decapcms.org/docs/configuration-options/
backend:
  name: github
  repo: cybersentinellab/cybersentinellab-web
  branch: main
  auth_endpoint: api/auth
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
publish_mode: editorial_workflow
site_url: https://cybersentinellab.com
display_url: https://cybersentinellab.com
logo_url: /images/logo-color.svg
media_folder: src/assets/uploads
public_folder: ../../assets/uploads
collections:
- name: blog
  label: Blog posts
  folder: src/content/blog
  create: true
  slug: '{{fields.slug}}'
  extension: md
  format: frontmatter
  summary: '{{title}} — {{date | date("YYYY-MM-DD")}}'
  sortable_fields:
  - date
  - title
  fields:
  - label: Title
    name: title
    widget: string
  - label: Slug (URL)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Lowercase letters, numbers and hyphens only
    hint: e.g. ransomware-readiness-checklist
  - label: Publish date
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD MMM YYYY
    time_format: false
  - label: Author
    name: author
    widget: string
    default: Cyber Sentinel Lab
  - label: Cover image
    name: cover
    widget: image
    required: false
    hint: Landscape, at least 1600×900 px
  - label: Cover image alt text
    name: coverAlt
    widget: string
    required: false
    hint: Describe the image for screen readers
  - label: Excerpt
    name: excerpt
    widget: text
    hint: 1–2 sentences shown on cards and in search results
  - label: Tags
    name: tags
    widget: list
    default: []
    required: false
  - label: Body
    name: body
    widget: markdown
  - label: SEO title
    name: seoTitle
    widget: string
    required: false
    hint: Optional. Defaults to the title. Keep under 60 characters.
  - label: Meta description
    name: metaDescription
    widget: text
    required: false
    hint: Optional. Defaults to the excerpt. Keep under 155 characters.
  - label: Hide from site (draft)
    name: draft
    widget: boolean
    default: false
    required: false
