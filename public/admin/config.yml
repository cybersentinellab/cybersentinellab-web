- name: services
  label: Services
  folder: src/content/services
  create: true
  slug: '{{fields.slug}}'
  extension: md
  format: frontmatter
  summary: '{{order}}. {{title}}'
  sortable_fields:
  - order
  - title
  fields:
  - label: Title
    name: title
    widget: string
  - label: Slug (URL)
    name: slug
    widget: string
    hint: Changing this changes the page URL
  - label: Italic accent (last words of the title)
    name: titleAccent
    widget: string
    required: false
  - label: Order
    name: order
    widget: number
    value_type: int
    default: 99
  - label: Icon
    name: icon
    widget: select
    options:
    - shield
    - shieldcheck
    - target
    - search
    - radar
    - eye
    - file
    - pulse
    - nodes
    - cloud
    - key
    - lock
    - factory
    - chip
    - users
    - code
    - server
    - globe
    default: shield
  - label: Summary (cards)
    name: summary
    widget: text
  - label: Intro (page header)
    name: intro
    widget: text
  - label: Tags
    name: tags
    widget: list
    required: false
  - label: What is included
    name: features
    widget: list
    fields:
    - label: Title
      name: title
      widget: string
    - label: Text
      name: text
      widget: text
  - label: Process steps
    name: steps
    widget: list
    required: false
    fields:
    - label: Title
      name: title
      widget: string
    - label: Text
      name: text
      widget: text
  - label: Outcomes
    name: outcomes
    widget: list
    required: false
  - label: FAQs
    name: faqs
    widget: list
    fields:
    - label: Question
      name: q
      widget: string
    - label: Answer
      name: a
      widget: text
    hint: Write answers that make sense on their own — AI search engines quote them.
  - label: Extra content (optional)
    name: body
    widget: markdown
    required: false
  - label: SEO title
    name: seoTitle
    widget: string
    required: false
  - label: Meta description
    name: metaDescription
    widget: text
    required: false
